<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه جامع علوم تجربی پایه هشتم</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    h1 { color: var(--accent); font-size: 1.8rem; margin-bottom: 8px; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }
    
    .chapter-selector { margin-bottom: 20px; }
    select {
      width: 100%; padding: 12px; background: var(--card-bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; cursor: pointer;
    }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 12px; background: var(--card-bg); border: 1px solid var(--border);
      color: var(--text-muted); border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold;
      transition: all 0.2s;
    }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .tab-content { display: none; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    .tab-content.active { display: block; }

    /* اسلایدها */
    .slide-viewer { text-align: center; padding: 20px; min-height: 220px; display: flex; flex-direction: column; justify-content: center; }
    .slide-title { font-size: 1.4rem; color: var(--accent); margin-bottom: 15px; }
    .slide-body { font-size: 1.1rem; color: var(--text); margin-bottom: 20px; }
    .slide-controls { display: flex; justify-content: space-between; align-items: center; }
    .btn {
      padding: 8px 18px; background: var(--accent); color: #000; border: none; border-radius: 6px;
      font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* کوییز */
    .quiz-question { font-size: 1.1rem; margin-bottom: 15px; font-weight: bold; }
    .quiz-options { display: grid; gap: 10px; }
    .quiz-opt-btn {
      padding: 12px; background: #1e293b; color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; cursor: pointer; text-align: right; transition: 0.2s; font-size: 0.95rem;
    }
    .quiz-opt-btn:hover { background: #334155; }
    .quiz-opt-btn.correct { background: var(--success) !important; color: #fff; }
    .quiz-opt-btn.wrong { background: var(--danger) !important; color: #fff; }

    /* باکس هوش مصنوعی */
    .ai-wrapper { margin-top: 30px; background: var(--card-bg); border: 1px solid var(--accent); border-radius: 12px; padding: 20px; }
    .ai-title { display: flex; align-items: center; gap: 8px; color: var(--accent); margin-bottom: 12px; }
    .ai-input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px; background: #0b0f19; border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; font-size: 0.95rem; outline: none;
    }
    .ai-answer {
      background: #0b0f19; border: 1px solid var(--border); border-radius: 8px; padding: 15px;
      margin-top: 15px; line-height: 1.8; color: #e2e8f0; white-space: pre-line; display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>سامانه هوشمند علوم تجربی هشتم</h1>
    <p class="subtitle">شامل اسلایدهای آموزشی، جزوه امتحانی، کوییز تستی و دستیار هوشمند جمنای</p>
  </header>

  <div class="chapter-selector">
    <select id="chapterSelect" onchange="changeChapter()"></select>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('presentation')">📽️ اسلایدها</button>
    <button class="tab-btn" onclick="switchTab('notes')">📖 خلاصه درس</button>
    <button class="tab-btn" onclick="switchTab('quiz')">✍️ آزمون تستی</button>
  </div>

  <!-- تب اسلاید -->
  <div id="tab-presentation" class="tab-content active">
    <div class="slide-viewer">
      <div id="slideTitle" class="slide-title"></div>
      <div id="slideBody" class="slide-body"></div>
      <div class="slide-controls">
        <button class="btn" id="prevSlideBtn" onclick="prevSlide()">قبلی</button>
        <span id="slideIndicator" style="color: var(--text-muted); font-size: 0.9rem;"></span>
        <button class="btn" id="nextSlideBtn" onclick="nextSlide()">بعدی</button>
      </div>
    </div>
  </div>

  <!-- تب جزوه -->
  <div id="tab-notes" class="tab-content">
    <div id="notesContent" style="line-height: 2;"></div>
  </div>

  <!-- تب کوییز -->
  <div id="tab-quiz" class="tab-content">
    <div id="quizQuestion" class="quiz-question"></div>
    <div id="quizOptions" class="quiz-options"></div>
    <div id="quizFeedback" style="margin-top: 15px; font-weight: bold;"></div>
  </div>

  <!-- پنل گفت‌وگو با هوش مصنوعی -->
  <div class="ai-wrapper">
    <div class="ai-title">
      <h3>🤖 دستیار صوتی و علمی جمنای (علوم هشتم)</h3>
    </div>
    <div class="ai-input-group">
      <input type="password" id="geminiApiKey" placeholder="کلید API جمنای را وارد کنید (AIzaSy...)" />
      <div style="display: flex; gap: 8px;">
        <input type="text" id="aiQuery" placeholder="مثلاً: قانون اهم را با یک مثال ملموس توضیح بده..." style="flex: 1;" />
        <button class="btn" onclick="askAi()">ارسال پرسش</button>
      </div>
    </div>
    <div id="aiResponse" class="ai-answer"></div>
  </div>
</div>

<script>
  // آدرس ورکر اختصاصی کلودفلر شما
  const WORKER_URL = "https://weathered-brook-e9b3.fvgbhj.workers.dev";

  const lessons = [
    { id: 1, title: "فصل ۱: مخلوط و جداسازی مواد", slides: [{ t: "مخلوط همگن و ناهمگن", b: "مخلوط همگن یا محلول‌ها ذرات یکنواخت دارند، مانند آب‌نمک. مخلوط‌های ناهمگن مانند شربت معده ته‌نشین می‌شوند." }, { t: "انحلال‌پذیری", b: "بیشترین مقدار ماده‌ای که در ۱۰۰ گرم آب در دمای مشخص حل می‌شود." }], notes: "مخلوط‌ها دو دسته‌اند: همگن و ناهمگن. انحلال‌پذیری گازها با افزایش دما کاهش می‌یابد اما نمک پتاسیم نیترات با افزایش دما بیشتر حل می‌شود.", quiz: { q: "کدام گزینه یک مخلوط همگن است؟", o: ["شربت معده", "آب‌نمک", "خاک باغچه", "شیر"], a: 1 } },
    { id: 2, title: "فصل ۲: تغییرهای شیمیایی در خدمت زندگی", slides: [{ t: "تغییر شیمیایی", b: "تغییری که در آن هویت و ساختار ماده عوض شده و ماده جدیدی پدید می‌آید." }], notes: "سوختن یک تغییر شیمیایی گرمازا است که نیازمند ماده سوختنی، گرما و اکسیژن است.", quiz: { q: "کدام عامل در مثلث آتش حضور ندارد؟", o: ["اکسیژن", "ماده سوختنی", "گرما", "نیتروژن"], a: 3 } },
    { id: 3, title: "فصل ۳: از درون اتم چه خبر", slides: [{ t: "ذرات زیراتمی", b: "پروتون (مثبت) و نوترون (خنثی) درون هسته، الکترون (منفی) در اطراف هسته قرار دارند." }], notes: "عدد اتمی برابر تعداد پروتون‌ها و عدد جرمی مجموع تعداد پروتون‌ها و نوترون‌ها است.", quiz: { q: "بار الکتریکی نوترون چیست؟", o: ["مثبت", "منفی", "خنثی", "متغیر"], a: 2 } },
    { id: 4, title: "فصل ۴: تنظیم عصبی", slides: [{ t: "دستگاه عصبی", b: "شامل بخش مرکزی (مغز و نخاع) و بخش محیطی (اعصاب حسی و حرکتی) است." }], notes: "یاخته‌های بافت عصبی نورون نام دارند و شامل دندریت، جسم سلولی و آکسون هستند.", quiz: { q: "کدام بخش نورون پیام عصبی را از جسم سلولی دور می‌کند؟", o: ["دندریت", "آکسون", "هسته", "غلاف میلین"], a: 1 } },
    { id: 5, title: "فصل ۵: حس و حرکت", slides: [{ t: "اندام‌های حسی", b: "گیرنده‌های بینایی در شبکیه، چشایی در زبان و بویایی در بالای حفره بینی قرار دارند." }], notes: "ماهیچه‌ها به سه نوع مخطط (اسکلتی)، صاف و قلبی تقسیم می‌شوند.", quiz: { q: "ماهیچه قلب چه نوع عملکردی دارد؟", o: ["ارادی", "غیرارادی و مخطط", "غیرارادی و صاف", "ارادی و صاف"], a: 1 } },
    { id: 6, title: "فصل ۶: تنظیم هورمونی", slides: [{ t: "غدد درون‌ریز", b: "هورمون‌ها را مستقیماً وارد خون می‌کنند تا فعالیت‌های بدن تنظیم شوند." }], notes: "غده هیپوفیز به عنوان غده فرمانده شناخته می‌شود و فعالیت سایر غدد را تنظیم می‌کند.", quiz: { q: "انسولین از کدام غده ترشح می‌شود؟", o: ["تیروئید", "پانکراس (لوزالمعده)", "فوق کلیه", "هیپوفیز"], a: 1 } },
    { id: 7, title: "فصل ۷: الفبای زیست‌فناوری", slides: [{ t: "ژن و صفات", b: "عوامل تعیین‌کننده صفات، ژن‌ها هستند که روی مولکول DNA قرار دارند." }], notes: "تقسیم میتوز برای رشد و ترمیم، و تقسیم میوز برای تولید یاخته‌های جنسی انجام می‌شود.", quiz: { q: "کدام تقسیم تعداد کروموزوم‌ها را نصف می‌کند؟", o: ["میتوز", "میوز", "جوانه‌زدن", "دو نیم شدن"], a: 1 } },
    { id: 8, title: "فصل ۸: تولید مثل در جانداران", slides: [{ t: "تولید مثل غیرجنسی", b: "نیازی به دو جنس نر و ماده ندارد؛ مانند جوانه‌زدن مخمر و دونیم‌شدن باکتری." }], notes: "لقاح به دو صورت خارجی (مانند بیشتر ماهی‌ها) و داخلی (مانند پستانداران) انجام می‌شود.", quiz: { q: "روش تولید مثل مخمر چیست؟", o: ["هاگ‌زایی", "جوانه‌زدن", "تقطیع", "لقاح"], a: 1 } },
    { id: 9, title: "فصل ۹: الکتریسیته", slides: [{ t: "بار الکتریکی و قانون اهم", b: "بارهای همنام یکدیگر را می‌رانند. بر طبق قانون اهم: V = I × R" }], notes: "جریان الکتریکی حاصل حرکت الکترون‌ها در یک رسانا است. ولت سنج به صورت موازی و آمپرسنج متوالی وصل می‌شود.", quiz: { q: "یکا (واحد) مقاومت الکتریکی چیست؟", o: ["آمپر", "ولت", "اهم", "وات"], a: 2 } },
    { id: 10, title: "فصل ۱۰: مغناطیس", slides: [{ t: "خاصیت مغناطیسی", b: "آهنربا دارای دو قطب شمال (N) و جنوب (S) است. قطب‌های همنام همدیگر را می‌رانند." }], notes: "با عبور جریان از یک سیم‌پیچ، میدان مغناطیسی ایجاد می‌شود که اساس ساخت آهنربای الکتریکی است.", quiz: { q: "کدام فلز جذب آهنربا نمی‌شود؟", o: ["آهن", "نیکل", "کبالت", "مس"], a: 3 } },
    { id: 11, title: "فصل ۱۱: کانی‌ها", slides: [{ t: "کانی چیست؟", b: "مواد طبیعی، جامد، متبلور و غیرآلی هستند که در پوسته زمین یافت می‌شوند." }], notes: "کانی‌ها بر اساس ترکیب شیمیایی به سیلیکات‌ها و غیرسیلیکات‌ها تقسیم می‌شوند.", quiz: { q: "کدام گزینه تعریف کانی نیست؟", o: ["متبلور بودن", "آلی بودن", "طبیعی بودن", "جامد بودن"], a: 1 } },
    { id: 12, title: "فصل ۱۲: سنگ‌ها", slides: [{ t: "چرخه سنگ‌ها", b: "سنگ‌ها به سه گروه آذرین، رسوبی و دگرگونی دسته‌بندی می‌شوند." }], notes: "سنگ‌های رسوبی تنها سنگ‌هایی هستند که در آن‌ها فسیل تشکیل می‌شود.", quiz: { q: "فسیل در کدام دسته از سنگ‌ها یافت می‌شود؟", o: ["آذرین درونی", "آذرین بیرونی", "رسوبی", "دگرگونی"], a: 2 } },
    { id: 13, title: "فصل ۱۳: هوازدگی", slides: [{ t: "هوازدگی فیزیکی و شیمیایی", b: "فیزیکی سنگ خرد می‌شود؛ در شیمیایی ترکیب شیمیایی سنگ عوض می‌شود." }], notes: "یخ بستن آب در شکاف سنگ‌ها اصلی‌ترین عامل هوازدگی فیزیکی است.", quiz: { q: "زنگ زدن آهن نمونه‌ای از کدام پدیده است؟", o: ["هوازدگی فیزیکی", "هوازدگی شیمیایی", "فرسایش بادی", "دگرگونی"], a: 1 } },
    { id: 14, title: "فصل ۱۴: نور و ویژگی‌های آن", slides: [{ t: "بازتاب نور و آینه‌ها", b: "زاویه تابش همواره با زاویه بازتاب برابر است. آینه‌ها: تخت، مقعر (کاو) و محدب (کوژ)." }], notes: "تصویر در آینه تخت: مجازی، مستقیم، هم‌اندازه و وارون جانبی است.", quiz: { q: "تصویر در آینه تخت چگونه است؟", o: ["حقیقی و وارونه", "مجازی و مستقیم", "بزرگتر از جسم", "وارونه و کوچکتر"], a: 1 } },
    { id: 15, title: "فصل ۱۵: شکست نور", slides: [{ t: "شکست نور و عدسی‌ها", b: "وقتی نور از محیطی به محیط شفاف دیگر با چگالی متفاوت می‌رود، مسیرش منحرف می‌شود." }], notes: "عدسی‌های همگرا لبه‌های نازک و مرکز ضخیم دارند؛ عدسی‌های واگرا برعکس هستند.", quiz: { q: "تجزیه نور سفید در منشور به چه دلیلی رخ می‌دهد؟", o: ["تفاوت سرعت رنگ‌ها", "بازتاب کامل", "جذب نور", "قطبش نور"], a: 0 } }
  ];

  let currentLessonIndex = 0;
  let currentSlideIndex = 0;

  // مقداردهی اولیه فهرست فصل‌ها
  const select = document.getElementById("chapterSelect");
  lessons.forEach((l, idx) => {
    const opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = l.title;
    select.appendChild(opt);
  });

  function renderLesson() {
    const lesson = lessons[currentLessonIndex];
    currentSlideIndex = 0;
    renderSlide();

    // خلاصه درس
    document.getElementById("notesContent").innerHTML = `<h3>${lesson.title}</h3><p style="margin-top:10px;">${lesson.notes}</p>`;

    // کوییز
    document.getElementById("quizQuestion").textContent = lesson.quiz.q;
    const optsBox = document.getElementById("quizOptions");
    optsBox.innerHTML = "";
    document.getElementById("quizFeedback").textContent = "";

    lesson.quiz.o.forEach((optText, i) => {
      const btn = document.createElement("button");
      btn.className = "quiz-opt-btn";
      btn.textContent = optText;
      btn.onclick = () => checkQuiz(i, lesson.quiz.a, btn);
      optsBox.appendChild(btn);
    });
  }

  function renderSlide() {
    const lesson = lessons[currentLessonIndex];
    const slide = lesson.slides[currentSlideIndex];
    document.getElementById("slideTitle").textContent = slide.t;
    document.getElementById("slideBody").textContent = slide.b;
    document.getElementById("slideIndicator").textContent = `اسلاید ${currentSlideIndex + 1} از ${lesson.slides.length}`;
    document.getElementById("prevSlideBtn").disabled = currentSlideIndex === 0;
    document.getElementById("nextSlideBtn").disabled = currentSlideIndex === lesson.slides.length - 1;
  }

  function nextSlide() {
    if (currentSlideIndex < lessons[currentLessonIndex].slides.length - 1) {
      currentSlideIndex++;
      renderSlide();
    }
  }

  function prevSlide() {
    if (currentSlideIndex > 0) {
      currentSlideIndex--;
      renderSlide();
    }
  }

  function changeChapter() {
    currentLessonIndex = parseInt(document.getElementById("chapterSelect").value);
    renderLesson();
  }

  function switchTab(tab) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    if (tab === 'presentation') {
      document.querySelector(".tabs button:nth-child(1)").classList.add("active");
      document.getElementById("tab-presentation").classList.add("active");
    } else if (tab === 'notes') {
      document.querySelector(".tabs button:nth-child(2)").classList.add("active");
      document.getElementById("tab-notes").classList.add("active");
    } else {
      document.querySelector(".tabs button:nth-child(3)").classList.add("active");
      document.getElementById("tab-quiz").classList.add("active");
    }
  }

  function checkQuiz(chosen, correct, btnElement) {
    const buttons = document.querySelectorAll(".quiz-opt-btn");
    buttons.forEach(b => b.disabled = true);
    if (chosen === correct) {
      btnElement.classList.add("correct");
      document.getElementById("quizFeedback").textContent = "✅ آفرین! پاسخ کاملاً درست است.";
      document.getElementById("quizFeedback").style.color = "var(--success)";
    } else {
      btnElement.classList.add("wrong");
      buttons[correct].classList.add("correct");
      document.getElementById("quizFeedback").textContent = "❌ نادرست بود. گزینه سبز پاسخ صحیح است.";
      document.getElementById("quizFeedback").style.color = "var(--danger)";
    }
  }

  // ذخیره کلید در مرورگر
  const apiKeyInput = document.getElementById("geminiApiKey");
  apiKeyInput.value = localStorage.getItem("user_gemini_key") || "";
  apiKeyInput.addEventListener("change", () => {
    localStorage.setItem("user_gemini_key", apiKeyInput.value.trim());
  });

  // ارتباط با هوش مصنوعی از طریق Cloudflare Worker
  async function askAi() {
    const apiKey = apiKeyInput.value.trim();
    const prompt = document.getElementById("aiQuery").value.trim();
    const resBox = document.getElementById("aiResponse");

    if (!apiKey) {
      alert("لطفاً ابتدا کلید اختصاصی جمنای را وارد کنید.");
      return;
    }
    if (!prompt) return;

    resBox.style.display = "block";
    resBox.textContent = "⏳ در حال دریافت پاسخ از جمنای بدون فیلترشکن...";

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          apiKey: apiKey,
          prompt: prompt,
          lessonTitle: lessons[currentLessonIndex].title
        })
      });

      const data = await response.json();
      if (data.candidates && data.candidates[0].content.parts[0].text) {
        resBox.textContent = data.candidates[0].content.parts[0].text;
      } else {
        resBox.textContent = "خطا در دریافت پاسخ: " + JSON.stringify(data);
      }
    } catch (err) {
      resBox.textContent = "خطا در اتصال: " + err.message;
    }
  }

  // لود اولیه درس اول
